name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: lenspack, POSTGRES_PASSWORD: lenspack, POSTGRES_DB: lenspack_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lenspack" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LENSPACK_PG_URL: postgres://lenspack:lenspack@localhost:5432/lenspack_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Zero-domain grep (core and compiler know no domain)
        run: pnpm lint:domain
      - name: Test (unit, property, two-engine parity, pack conformance)
        run: pnpm test
      - name: Build
        run: pnpm build
