  # ── T9. Definitions: questions that hang on a definition, on purpose (added 2026-11-23).
  # A good reply states the definition it used, or asks which one; a right number with no definition is partial.
  # Every entry maps to definitions.yaml. Post-rebase pack only (access, team and settlement type are on ni_visits):
  # run the pre-rebase suite with --tiers T1,T2,T3,T4,T5,T6,T7,T8.

  - id: T9.1
    tier: T9
    prompt: How many vaccinations have been given?
    expect: answer
    tags: [ambiguous, definitions]
    note: "definitions.yaml: vaccinated. Children vaccinated including revisits (47,798) or visits with outcome VACCINATED (47,585)."
    accept: { measures: [children_vaccinated, visits, vaccinated_children, doses_administered] }
    truth:
      shape: scalar
      unit: count
      sql: "SELECT sum(children_vaccinated) FROM su_ni_cov"
      alternatives:
        - { label: "visits with outcome VACCINATED (no revisits)", sql: "SELECT countIf(outcome = 'VACCINATED') FROM su_ni_task" }
    disclose: [revisit, outcome, including, excluding, definition, "counts each", "unique"]

  - id: T9.2
    tier: T9
    prompt: How much vaccine are we wasting?
    expect: answer
    tags: [ambiguous, definitions]
    note: "definitions.yaml: vial wastage. Dose-based 14.87% (config), doses over opened vials 14.42%, or spoilt over issued 0.39%."
    accept: { measures: [vial_wastage_pct, stock_vial_wastage_pct, spoilt_vials_pct, stock_spoilt_vials_pct, vials_used] }
    truth:
      shape: scalar
      unit: ratio
      sql: "SELECT 1 - (SELECT sum(children_vaccinated) FROM su_ni_cov) / ((sum(vials_issued) - (sum(vials_returned) - sum(opened_vials_returned) - sum(spoilt_vials_returned))) * 50) FROM su_ni_stock"
      alternatives:
        - { label: "doses over opened vials returned", sql: "SELECT 1 - (SELECT sum(children_vaccinated) FROM su_ni_cov) / (sum(opened_vials_returned) * 50) FROM su_ni_stock" }
        - { label: "spoilt vials over issued", sql: "SELECT sum(spoilt_vials_returned) / sum(vials_issued) FROM su_ni_stock" }
    disclose: ["50 doses", "50-dose", "doses per vial", "doses a vial", "dose-based", "spoilt", "opened vials", "vials used"]

  - id: T9.3
    tier: T9
    prompt: What proportion of children are zero-dose?
    expect: answer
    tags: [ambiguous, definitions]
    note: "definitions.yaml: zero-dose share. Of enumerated children 11.82% (config) or per child visit 11.40%."
    accept: { measures: [zero_dose_pct, zero_dose_children, children_enumerated, visits] }
    truth:
      shape: scalar
      unit: ratio
      sql: "SELECT sum(zero_dose_children) / sum(children_enumerated) FROM su_ni_zd_facility"
      alternatives:
        - { label: "zero-dose per child visit", sql: "SELECT sum(is_zero_dose) / count() FROM su_ni_task" }
    disclose: [enumerated, "per visit", "child visits", "of visits", "visited", "definition"]

  - id: T9.4
    tier: T9
    prompt: Which wards stayed below 100 vaccinations a day?
    expect: answer
    tags: [ambiguous, definitions, multi-step]
    note: "definitions.yaml: thresholds over days. Below 100 on every day (4 wards), on average (5), or on at least one day (7)."
    accept: { measures: [children_vaccinated, visits], dimension: [ward] }
    truth:
      shape: set
      unit: count
      sql: "SELECT ward FROM (SELECT ward, task_date, sum(is_vaccinated) n FROM su_ni_task GROUP BY ward, task_date) GROUP BY ward HAVING max(n) < 100"
      universe_sql: "SELECT DISTINCT ward FROM su_ni_task"
      alternatives:
        - { label: "daily average below 100", sql: "SELECT ward FROM (SELECT ward, task_date, sum(is_vaccinated) n FROM su_ni_task GROUP BY ward, task_date) GROUP BY ward HAVING avg(n) < 100" }
        - { label: "below 100 on at least one day", sql: "SELECT ward FROM (SELECT ward, task_date, sum(is_vaccinated) n FROM su_ni_task GROUP BY ward, task_date) GROUP BY ward HAVING min(n) < 100" }
    disclose: ["every day", "each day", "all seven", "all 7", "average", "at least one day", "any day", "any single day", "on one day", "never reached", "never hit", "never went"]

  - id: T9.5
    tier: T9
    prompt: How many field workers were there?
    expect: answer
    tags: [ambiguous, definitions]
    note: "definitions.yaml: field worker. The data has 45 team logins (USR-...), one per team; whether a login is a person or a team is not in the data."
    accept: { measures: [visits, children_vaccinated], dimension: [team] }
    truth: { shape: scalar, unit: count, sql: "SELECT uniqExact(team) FROM su_ni_task" }
    disclose: [login, team, account, user, "USR"]

  - id: T9.6
    tier: T9
    prompt: How many children did we reach?
    expect: answer
    tags: [ambiguous, definitions]
    note: "definitions.yaml: reached. Distinct children visited 48,251, child visits 50,000, or children vaccinated 47,798."
    accept: { measures: [visits, children_vaccinated, children_enumerated] }
    truth:
      shape: scalar
      unit: count
      sql: "SELECT uniqExact(individual_id) FROM su_ni_task"
      alternatives:
