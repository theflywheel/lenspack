# Built for eGov's synthetic HCM campaign data: the Kebbi demo data in eGov's development ClickHouse database
# (a 7-day polio vaccination campaign, 12-18 October 2026), read through Superset.
# The expected answers (joins.truth.json) hold only for that dataset and the date below. To use these
# questions on other data, point the config at your own Superset datasets and regenerate the answers with
# truth.py against your own ClickHouse.
#
# Format (read by lenspack evals/suite.ts):
#   id, tier, prompt (or turns: [..] for multi-turn), expect: answer | edit | decline
#   accept:  what a right query looks like (any of measures; dimension; filters; grain)
#   truth:   sql (ClickHouse, db default; never ch_* datasets, never kafka_* engine tables)
#            shape: scalar | map | set | list | series | table     unit: count | ratio | number
#            alternatives: [{label, sql}]   other defensible definitions (tag ambiguous)
#   disclose: words, one of which the reply must use to say which definition it used
#   why:     for expect: decline, the reason relative to the config under test: engine | pack | data | scope
#   widget:  for expect: edit, the widget that must exist afterwards (fields are any-of lists)
#
# Truth values in the comments were checked by SQL on 2026-11-22; truth.json is the record.

suite: hcm-superset-ng
config: configs/joins.yaml
board: { dashboard: 5 }   # every question starts on a fresh in-memory copy of dashboard 5
now: "2026-11-22T12:00:00Z"
day_one: "2026-10-12"

questions:
  # ── T1: totals ───────────────────────────────────────────────────────────
  - id: T1.1
    tier: T1
    prompt: How many households were registered?
    expect: answer
    accept: { measures: [households, households_registered] }
    truth: { shape: scalar, unit: count, sql: "SELECT sum(households_registered) FROM su_ni_cov" }   # 23,961
    cross: "SELECT count() FROM analytics.dm_household_registry WHERE tenant_id = 'ng'"

  - id: T1.2
    tier: T1
    prompt: How many child visits were recorded in total?
    expect: answer
    accept: { measures: [visits, task_records, doses_administered] }
    truth:
      shape: scalar
      unit: count
      sql: "SELECT count() FROM su_ni_task"   # 50,000
      alternatives:
        - { label: "excluding closed-household visits (no child seen)", sql: "SELECT countIf(outcome != 'CLOSED_HOUSEHOLD') FROM su_ni_task" }   # 48,250 (second author)
    disclose: [closed, "every visit", "all visits", including, excluding]

  - id: T1.3
    tier: T1
    prompt: How many vials were issued to the teams?
    expect: answer
    accept: { measures: [vials_issued, stock_units] }
    truth: { shape: scalar, unit: count, sql: "SELECT sum(vials_issued) FROM su_ni_team_stock" }   # 1,545
    cross: "SELECT sum(quantity_sum) FROM analytics.dm_stock_transactions WHERE tenant_id = 'ng' AND event_type = 'RECEIVED'"

  - id: T1.4
    tier: T1
    prompt: How many zero-dose children were found?
    expect: answer
    accept: { measures: [zero_dose_children, facility_zero_dose_children] }
    truth: { shape: scalar, unit: count, sql: "SELECT sum(zero_dose_children) FROM su_ni_zd_facility" }   # 5,701
    cross: "SELECT sum(is_zero_dose) FROM su_ni_task"

  - id: T1.5
    tier: T1
    prompt: How many health facilities are covered by the campaign?
    expect: answer
    accept: { measures: [facilities] }
    truth: { shape: scalar, unit: count, sql: "SELECT count() FROM su_ni_zd_facility" }   # 100

  - id: T1.6
    tier: T1
    prompt: How many children were vaccinated?
    expect: answer
    tags: [ambiguous]
    accept: { measures: [children_vaccinated, vaccinated_children, doses_delivered, daily_children_vaccinated] }
    truth:
      shape: scalar
      unit: count
      sql: "SELECT sum(children_vaccinated) FROM su_ni_cov"   # 47,798: is_vaccinated, includes the 213 revisits
      alternatives:
        - { label: "outcome VACCINATED only (no revisits)", sql: "SELECT countIf(outcome = 'VACCINATED') FROM su_ni_task" }   # 47,585
    disclose: [revisit, outcome, "vaccinated flag", is_vaccinated, "including", "excluding", definition]

  - id: T1.7
    tier: T1
    prompt: How many people live in the registered households?
    expect: answer
    accept: { measures: [people_registered] }
    truth: { shape: scalar, unit: count, sql: "SELECT sum(member_count) FROM analytics.dm_household_registry WHERE tenant_id = 'ng'" }   # 121,720

  - id: T1.8
    tier: T1
    prompt: How many children were referred to a health facility?
    expect: answer
    accept: { measures: [referred_children] }
    truth: { shape: scalar, unit: count, sql: "SELECT sum(referred_children_count) FROM analytics.dm_referral_summary WHERE tenant_id = 'ng'" }   # 61

  # ── T2: filtered and grouped ─────────────────────────────────────────────
  - id: T2.1
    tier: T2
    prompt: Break down the child visits by outcome.
    expect: answer
    accept: { measures: [visits, doses_administered], dimension: [outcome, administration_status] }
    truth:
      shape: map
      unit: count
      sql: "SELECT outcome, count() FROM su_ni_task GROUP BY outcome"   # VACCINATED 47,585 · CLOSED_HOUSEHOLD 1,750 · REFUSED 314 · REVISIT 213 · ABSENT 138
      alternatives:
        - { label: "SMC mart administration status", sql: "SELECT administration_status, sum(administered_count) FROM analytics.dm_smc_administered_base WHERE tenant_id = 'ng' GROUP BY 1" }

  - id: T2.2
    tier: T2
    prompt: How many children were vaccinated in Kalgo?
    expect: answer
    tags: [ambiguous]
    accept: { measures: [children_vaccinated, vaccinated_children, doses_delivered], filters: { lga: Kalgo } }
    truth:
      shape: scalar
      unit: count
      sql: "SELECT sum(children_vaccinated) FROM su_ni_cov WHERE lga = 'Kalgo'"
      alternatives:
        - { label: "outcome VACCINATED only", sql: "SELECT countIf(outcome = 'VACCINATED') FROM su_ni_task WHERE lga = 'Kalgo'" }
    disclose: [revisit, outcome, is_vaccinated, definition]

  - id: T2.3
    tier: T2
    prompt: How many vaccinated children were girls and how many were boys?
    expect: answer
    accept: { measures: [vaccinated_children, doses_delivered], dimension: [gender] }
    truth: { shape: map, unit: count, sql: "SELECT if(gender = '', 'UNKNOWN', toString(gender)) AS g, sum(is_vaccinated) FROM su_ni_task GROUP BY g HAVING sum(is_vaccinated) > 0" }

  - id: T2.4
    tier: T2
    prompt: Households registered in each LGA.
    expect: answer
    accept: { measures: [households, households_registered], dimension: [lga] }
    truth: { shape: map, unit: count, sql: "SELECT lga, sum(households_registered) FROM su_ni_cov GROUP BY lga" }

  - id: T2.5
    tier: T2
    prompt: How are the child visits split by age band?
    expect: answer
    accept: { measures: [visits], dimension: [age_band] }
    truth:
      shape: map
      unit: count
      sql: "SELECT age_band, count() FROM su_ni_task GROUP BY age_band"
      alternatives:
        - { label: "excluding closed households (recorded with age 0)", sql: "SELECT age_band, count() FROM su_ni_task WHERE outcome != 'CLOSED_HOUSEHOLD' GROUP BY age_band" }

  - id: T2.6
    tier: T2
    prompt: Zero-dose children in each LGA.
    expect: answer
    accept: { measures: [zero_dose_children, facility_zero_dose_children], dimension: [lga] }
    truth: { shape: map, unit: count, sql: "SELECT lga, sum(zero_dose_children) FROM su_ni_zd_facility GROUP BY lga" }   # BK 2,342 · Gwandu 2,106 · Kalgo 1,253

  - id: T2.7
    tier: T2
    prompt: Which 5 wards in Birnin Kebbi vaccinated the most children?
    expect: answer
    accept: { measures: [children_vaccinated, vaccinated_children, doses_delivered], dimension: [ward], filters: { lga: Birnin Kebbi } }
    truth: { shape: list, unit: count, k: 5, sql: "SELECT ward, sum(children_vaccinated) v FROM su_ni_cov WHERE lga = 'Birnin Kebbi' GROUP BY ward ORDER BY v DESC LIMIT 5" }

  - id: T2.8
    tier: T2
    prompt: How many visits found the household closed?
    expect: answer
    accept: { measures: [visits, doses_administered], filters: { outcome: CLOSED_HOUSEHOLD } }
    truth: { shape: scalar, unit: count, sql: "SELECT countIf(outcome = 'CLOSED_HOUSEHOLD') FROM su_ni_task" }   # 1,750

  # ── T3: time series ──────────────────────────────────────────────────────
  - id: T3.1
    tier: T3
    prompt: Show children vaccinated per day as a line chart.
    expect: edit
    tags: [ambiguous]
    accept: { measures: [daily_children_vaccinated, vaccinated_children, doses_delivered], grain: day }
    widget: { kind: [chart], chart: [line, area], query: { kind: [series], grain: [day], measure: [daily_children_vaccinated, vaccinated_children, doses_delivered] } }
    truth:
      shape: series
      unit: count
      sql: "SELECT task_date, sum(is_vaccinated) FROM su_ni_task GROUP BY task_date ORDER BY task_date"   # 6,277 · 7,249 · 7,261 · 7,087 · 7,161 · 6,640 · 6,123
      alternatives:
        - { label: "outcome VACCINATED only", sql: "SELECT task_date, countIf(outcome = 'VACCINATED') FROM su_ni_task GROUP BY task_date ORDER BY task_date" }

  - id: T3.2
    tier: T3
    prompt: Which campaign day had the most vaccinations, and how many?
    expect: answer
    tags: [ambiguous]
    accept: { measures: [daily_children_vaccinated, vaccinated_children, doses_delivered] }
    truth:
      shape: list
      unit: count
      k: 1
      sql: "SELECT toString(task_date), sum(is_vaccinated) v FROM su_ni_task GROUP BY task_date ORDER BY v DESC LIMIT 1"   # 2026-10-14 (day 3), 7,261
      alternatives:
        - { label: "outcome VACCINATED only", sql: "SELECT toString(task_date), countIf(outcome = 'VACCINATED') v FROM su_ni_task GROUP BY task_date ORDER BY v DESC LIMIT 1" }   # 7,227
    disclose: [revisit, outcome, is_vaccinated, definition]

  - id: T3.3
    tier: T3
    prompt: How many households were registered each day?
    expect: answer
    accept: { measures: [daily_households_registered, households], grain: day }
    truth: { shape: series, unit: count, sql: "SELECT d.event_date, sum(c.households_registered) FROM su_ni_cov c LEFT JOIN (SELECT campaign_day, any(event_date) event_date FROM su_ni_days GROUP BY campaign_day) d ON d.campaign_day = c.campaign_day GROUP BY d.event_date ORDER BY d.event_date" }
    cross: "SELECT event_date, count() FROM analytics.dm_household_registry WHERE tenant_id = 'ng' GROUP BY event_date ORDER BY event_date"

  - id: T3.4
    tier: T3
    prompt: Plot cumulative children vaccinated against the plan, as a share of target, by day.
    expect: edit
    accept: { measures: [actual_children_cum_pct, planned_children_cum_pct], grain: day }
    widget: { kind: [chart], chart: [line, area], query: { kind: [series], measure: [actual_children_cum_pct, planned_children_cum_pct] } }
    truth:
      shape: series
      unit: ratio
      sql: |
        WITH t AS (SELECT sum(target_population) ct FROM analytics.dm_targets_base
                   WHERE tenant_id = 'ng' AND campaign_number = 'CMP-2026-10-12-009101' AND node_level = 6 AND target_type = 'INDIVIDUAL'),
             d AS (SELECT campaign_day, sum(children_vaccinated) cv FROM su_ni_cov GROUP BY campaign_day)
        SELECT dd.event_date, sum(d.cv) OVER (ORDER BY d.campaign_day) / any(t.ct) OVER () FROM d CROSS JOIN t
        LEFT JOIN (SELECT campaign_day, any(event_date) event_date FROM su_ni_days GROUP BY campaign_day) dd ON dd.campaign_day = d.campaign_day
        ORDER BY d.campaign_day

  - id: T3.5
    tier: T3
    prompt: Child visits per day in Gwandu.
    expect: answer
    accept: { measures: [visits], grain: day, filters: { lga: Gwandu } }
    truth: { shape: series, unit: count, sql: "SELECT task_date, count() FROM su_ni_task WHERE lga = 'Gwandu' GROUP BY task_date ORDER BY task_date" }

  - id: T3.6
    tier: T3
    prompt: How many children were vaccinated in the last 30 days?
    expect: decline
    why: data
    note: The data ends 18 Oct 2026 and the eval clock is 22 Nov, so the window is empty. A good reply says so and offers the campaign's dates (or gives the campaign total, saying it's from 12–18 Oct).

  # ── T4: ratios and coverage against targets ─────────────────────────────
  - id: T4.1
    tier: T4
    prompt: What is our overall coverage against the children target?
    expect: answer
    tags: [ambiguous]
    accept: { measures: [children_coverage_pct, actual_children_cum_pct] }
    truth:
      shape: scalar
      unit: ratio
      sql: "SELECT sum(children_vaccinated) / sumIf(target_children, is_last_day = 1) FROM su_ni_cov"   # 0.93768
      alternatives:
        - { label: "outcome VACCINATED only", sql: "SELECT (SELECT countIf(outcome = 'VACCINATED') FROM su_ni_task) / (SELECT sumIf(target_children, is_last_day = 1) FROM su_ni_cov)" }   # 0.93350
    disclose: [revisit, outcome, is_vaccinated, definition]

  - id: T4.2
    tier: T4
    prompt: Children coverage by LGA.
    expect: answer
    tags: [trap]
    accept: { measures: [children_coverage_pct], dimension: [lga] }
    truth: { shape: map, unit: ratio, sql: "SELECT lga, sum(children_vaccinated) / sumIf(target_children, is_last_day = 1) FROM su_ni_cov GROUP BY lga" }   # BK 0.93784 · Gwandu 0.93597 · Kalgo 0.94002 (averaging settlements: 0.9433 / 0.9394 / 0.9436)

  - id: T4.3
    tier: T4
    prompt: What share of enumerated children are zero-dose?
    expect: answer
    accept: { measures: [facility_zero_dose_children, facility_children_enumerated, zero_dose_children] }
    truth: { shape: scalar, unit: ratio, sql: "SELECT sum(zero_dose_children) / sum(children_enumerated) FROM su_ni_zd_facility" }   # 0.11816

  - id: T4.4
    tier: T4
    prompt: How are we doing on household registration against the household target?
    expect: answer
    accept: { measures: [households_coverage_pct, actual_households_cum_pct] }
    truth:
      shape: scalar
      unit: ratio
      sql: "SELECT (SELECT sum(households_registered) FROM su_ni_cov) / (SELECT sum(target_population) FROM analytics.dm_targets_base WHERE tenant_id = 'ng' AND campaign_number = 'CMP-2026-10-12-009101' AND node_level = 6 AND target_type = 'HOUSEHOLD')"   # 23,961 / 24,705

  - id: T4.5
    tier: T4
    prompt: What is the vial wastage rate?
    expect: answer
    tags: [ambiguous]
    accept: { measures: [vial_wastage_pct] }
    truth:
      shape: scalar
      unit: ratio
      # The pack's own definition (dataset 9's vial_wastage_pct): doses unaccounted for in the vials used.
      sql: "SELECT 1 - (SELECT sum(children_vaccinated) FROM su_ni_cov) / ((sum(vials_issued) - (sum(vials_returned) - sum(opened_vials_returned) - sum(spoilt_vials_returned))) * 50) FROM su_ni_stock"   # 0.1487
      alternatives:
        - { label: "doses over opened vials returned (second author)", sql: "SELECT 1 - (SELECT sum(children_vaccinated) FROM su_ni_cov) / (sum(opened_vials_returned) * 50) FROM su_ni_stock" }   # 0.1442
        - { label: "spoilt vials over issued (second author's primary)", sql: "SELECT sum(spoilt_vials_returned) / sum(vials_issued) FROM su_ni_stock" }   # 0.0039
    disclose: ["50 doses", "50-dose", "doses per vial", "doses a vial", spoilt, "opened vials"]

  - id: T4.6
    tier: T4
    prompt: What share of issued vials came back spoilt?
    expect: answer
    accept: { measures: [spoilt_vials_pct] }
    truth: { shape: scalar, unit: ratio, sql: "SELECT sum(spoilt_vials_returned) / sum(vials_issued) FROM su_ni_stock" }   # 6 / 1,545

  - id: T4.7
    tier: T4
    prompt: What is children coverage in Gwandu?
    expect: answer
    accept: { measures: [children_coverage_pct], filters: { lga: Gwandu } }
    truth: { shape: scalar, unit: ratio, sql: "SELECT sum(children_vaccinated) / sumIf(target_children, is_last_day = 1) FROM su_ni_cov WHERE lga = 'Gwandu'" }   # 0.93597

  - id: T4.8
    tier: T4
    prompt: Household registration coverage by LGA.
    expect: answer
    accept: { measures: [households_coverage_pct], dimension: [lga] }
    truth:
      shape: map
      unit: ratio
      sql: |
        SELECT c.lga, sum(c.hr) / sum(t.ht) FROM
          (SELECT lga, settlement_code, sum(households_registered) hr FROM su_ni_cov GROUP BY lga, settlement_code) c
          LEFT JOIN (SELECT level_six_code code, sum(target_population) ht FROM analytics.dm_targets_base
                     WHERE tenant_id = 'ng' AND campaign_number = 'CMP-2026-10-12-009101' AND node_level = 6 AND target_type = 'HOUSEHOLD' GROUP BY code) t
          ON t.code = c.settlement_code
        GROUP BY c.lga

  # ── T5: ranking, thresholds, multi-step ─────────────────────────────────
  - id: T5.1
    tier: T5
    prompt: Which wards are below 90% children coverage?
    expect: answer
    tags: [trap]
    accept: { measures: [children_coverage_pct], dimension: [ward] }
    truth: { shape: set, sql: "SELECT ward FROM su_ni_cov GROUP BY ward HAVING sum(children_vaccinated) / sumIf(target_children, is_last_day = 1) < 0.9", universe_sql: "SELECT DISTINCT ward FROM su_ni_cov" }   # Nassarawa I, Ambursa, Masama (averaging drops Masama)

  - id: T5.2
    tier: T5
    prompt: Which wards in Gwandu are below 90% coverage?
    expect: answer
    tags: [trap]
    accept: { measures: [children_coverage_pct], dimension: [ward], filters: { lga: Gwandu } }
    truth: { shape: set, sql: "SELECT ward FROM su_ni_cov WHERE lga = 'Gwandu' GROUP BY ward HAVING sum(children_vaccinated) / sumIf(target_children, is_last_day = 1) < 0.9", universe_sql: "SELECT DISTINCT ward FROM su_ni_cov WHERE lga = 'Gwandu'" }   # Masama

  - id: T5.3
    tier: T5
    prompt: Which 5 health facilities have the lowest children coverage?
    expect: answer
    accept: { measures: [children_coverage_pct], dimension: [health_facility] }
    truth: { shape: list, unit: ratio, k: 5, sql: "SELECT health_facility, sum(children_vaccinated) / sumIf(target_children, is_last_day = 1) r FROM su_ni_cov GROUP BY health_facility ORDER BY r ASC LIMIT 5" }

  - id: T5.4
    tier: T5
    prompt: Which LGA has the highest share of zero-dose children?
    expect: answer
    tags: [ambiguous]
    note: "Share of what: of the LGA's enumerated children (primary), of its child visits, or of all zero-dose children? Birnin Kebbi under each. Found in the 2026-11-22 full run: models split three ways."
    accept: { measures: [facility_zero_dose_children, facility_children_enumerated, zero_dose_children], dimension: [lga] }
    truth:
      shape: list
      unit: ratio
      k: 1
      sql: "SELECT lga, sum(zero_dose_children) / sum(children_enumerated) r FROM su_ni_zd_facility GROUP BY lga ORDER BY r DESC LIMIT 1"   # Birnin Kebbi 0.1217
      alternatives:
        - { label: "zero-dose per child visit", sql: "SELECT lga, sum(is_zero_dose) / count() r FROM su_ni_task GROUP BY lga ORDER BY r DESC LIMIT 1" }
        - { label: "share of all zero-dose children", sql: "SELECT lga, sum(zero_dose_children) / (SELECT sum(zero_dose_children) FROM su_ni_zd_facility) r FROM su_ni_zd_facility GROUP BY lga ORDER BY r DESC LIMIT 1" }
    disclose: ["of all zero-dose", "all zero-dose", "visits", "visited", "enumerated", "rate", "within", "own"]

  - id: T5.5
    tier: T5
    prompt: How many wards are above 95% children coverage?
    expect: answer
    tags: [ambiguous]
    accept: { measures: [children_coverage_pct], dimension: [ward] }
    truth:
      shape: scalar
      unit: count
      sql: "SELECT count() FROM (SELECT ward FROM su_ni_cov GROUP BY ward HAVING sum(children_vaccinated) / sumIf(target_children, is_last_day = 1) > 0.95)"   # 8
      alternatives:
        - { label: "outcome VACCINATED only", sql: "SELECT count() FROM (SELECT t.ward, t.v / c.tg r FROM (SELECT ward, countIf(outcome = 'VACCINATED') v FROM su_ni_task GROUP BY ward) t JOIN (SELECT ward, sumIf(target_children, is_last_day = 1) tg FROM su_ni_cov GROUP BY ward) c ON c.ward = t.ward WHERE r > 0.95)" }   # 6 (second author)
    disclose: [revisit, outcome, is_vaccinated, definition]

  - id: T5.6
    tier: T5
    prompt: Compare Birnin Kebbi and Kalgo on children coverage and zero-dose share.
    expect: answer
    tags: [ambiguous]
    note: "Zero-dose share of what: enumerated children (primary), child visits, or all zero-dose children. Found in the 2026-11-22 full run."
    accept: { measures: [children_coverage_pct, facility_zero_dose_children, facility_children_enumerated], dimension: [lga] }
    truth:
      shape: table
      unit: ratio
      sql: |
        SELECT c.lga, c.cov AS coverage, z.zd AS zero_dose_share FROM
          (SELECT lga, sum(children_vaccinated) / sumIf(target_children, is_last_day = 1) cov FROM su_ni_cov WHERE lga IN ('Birnin Kebbi', 'Kalgo') GROUP BY lga) c
          JOIN (SELECT lga, sum(zero_dose_children) / sum(children_enumerated) zd FROM su_ni_zd_facility GROUP BY lga) z ON z.lga = c.lga
      alternatives:
        - label: zero-dose per child visit
          sql: "SELECT c.lga, c.cov AS coverage, z.zd AS zero_dose_share FROM (SELECT lga, sum(children_vaccinated) / sumIf(target_children, is_last_day = 1) cov FROM su_ni_cov WHERE lga IN ('Birnin Kebbi', 'Kalgo') GROUP BY lga) c JOIN (SELECT lga, sum(is_zero_dose) / count() zd FROM su_ni_task GROUP BY lga) z ON z.lga = c.lga"
        - label: share of all zero-dose children
          sql: "SELECT c.lga, c.cov AS coverage, z.zd AS zero_dose_share FROM (SELECT lga, sum(children_vaccinated) / sumIf(target_children, is_last_day = 1) cov FROM su_ni_cov WHERE lga IN ('Birnin Kebbi', 'Kalgo') GROUP BY lga) c JOIN (SELECT lga, sum(zero_dose_children) / (SELECT sum(zero_dose_children) FROM su_ni_zd_facility) zd FROM su_ni_zd_facility GROUP BY lga) z ON z.lga = c.lga"
    disclose: ["of all zero-dose", "all zero-dose", "visits", "visited", "enumerated", "rate", "within", "own"]

  - id: T5.7
    tier: T5
    prompt: Which settlement has the lowest children coverage?
    expect: answer
    tags: [ambiguous]
    accept: { measures: [children_coverage_pct], dimension: [settlement] }
    truth:
      shape: list
      unit: ratio
      k: 1
      sql: "SELECT community, sum(children_vaccinated) / sumIf(target_children, is_last_day = 1) r FROM su_ni_cov GROUP BY community, settlement_code ORDER BY r ASC LIMIT 1"   # Yalango 0.725
      alternatives:
        - { label: "outcome VACCINATED only", sql: "SELECT t.community, t.v / c.tg r FROM (SELECT community, settlement_code, countIf(outcome = 'VACCINATED') v FROM su_ni_task GROUP BY community, settlement_code) t JOIN (SELECT settlement_code, sumIf(target_children, is_last_day = 1) tg FROM su_ni_cov GROUP BY settlement_code) c ON c.settlement_code = t.settlement_code ORDER BY r ASC LIMIT 1" }   # Tungar Jatau 0.7245 (second author)
    disclose: [revisit, outcome, is_vaccinated, definition]

  - id: T5.8
    tier: T5
    prompt: What share of all vaccinations happened in Birnin Kebbi?
    expect: answer
    accept: { measures: [children_vaccinated, vaccinated_children, doses_delivered], dimension: [lga] }
    truth: { shape: scalar, unit: ratio, sql: "SELECT sumIf(children_vaccinated, lga = 'Birnin Kebbi') / sum(children_vaccinated) FROM su_ni_cov" }

  # ── T6: cross-entity ─────────────────────────────────────────────────────
  - id: T6.1
    tier: T6
    prompt: For each LGA, give children coverage, zero-dose share and households registered.
    expect: answer
    tags: [ambiguous]
    note: "Zero-dose share of what: enumerated children (primary), child visits, or all zero-dose children. Found in the 2026-11-22 full run."
    accept: { measures: [children_coverage_pct, facility_zero_dose_children, households_registered, households], dimension: [lga] }
    truth:
      shape: table
      unit: number
      sql: |
        SELECT c.lga, c.cov AS coverage, z.zd AS zero_dose_share, c.hr AS households FROM
          (SELECT lga, sum(children_vaccinated) / sumIf(target_children, is_last_day = 1) cov, sum(households_registered) hr FROM su_ni_cov GROUP BY lga) c
          JOIN (SELECT lga, sum(zero_dose_children) / sum(children_enumerated) zd FROM su_ni_zd_facility GROUP BY lga) z ON z.lga = c.lga
      alternatives:
        - label: zero-dose per child visit
          sql: "SELECT c.lga, c.cov AS coverage, z.zd AS zero_dose_share, c.hr AS households FROM (SELECT lga, sum(children_vaccinated) / sumIf(target_children, is_last_day = 1) cov, sum(households_registered) hr FROM su_ni_cov GROUP BY lga) c JOIN (SELECT lga, sum(is_zero_dose) / count() zd FROM su_ni_task GROUP BY lga) z ON z.lga = c.lga"
        - label: share of all zero-dose children
          sql: "SELECT c.lga, c.cov AS coverage, z.zd AS zero_dose_share, c.hr AS households FROM (SELECT lga, sum(children_vaccinated) / sumIf(target_children, is_last_day = 1) cov, sum(households_registered) hr FROM su_ni_cov GROUP BY lga) c JOIN (SELECT lga, sum(zero_dose_children) / (SELECT sum(zero_dose_children) FROM su_ni_zd_facility) zd FROM su_ni_zd_facility GROUP BY lga) z ON z.lga = c.lga"
    disclose: ["of all zero-dose", "all zero-dose", "visits", "visited", "enumerated", "rate", "within", "own"]

  - id: T6.2
    tier: T6
    prompt: Show children referred and zero-dose children side by side for each LGA.
    expect: answer
    accept: { measures: [referred_children, zero_dose_children, facility_zero_dose_children], dimension: [lga] }
    truth:
      shape: table
      unit: count
      sql: |
        SELECT z.lga, r.ref AS referred, z.zd AS zero_dose FROM
          (SELECT lga, sum(zero_dose_children) zd FROM su_ni_zd_facility GROUP BY lga) z
          LEFT JOIN (SELECT n.name lga, sum(s.referred_children_count) ref FROM analytics.dm_referral_summary s
                     JOIN (SELECT code, any(value) name FROM analytics.boundary_hierarchy_localization_dim WHERE tenant_id = 'ng' GROUP BY code) n ON n.code = s.level_three_code
                     WHERE s.tenant_id = 'ng' GROUP BY lga) r ON r.lga = z.lga

