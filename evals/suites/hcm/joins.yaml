        - { label: "children vaccinated", sql: "SELECT sum(children_vaccinated) FROM su_ni_cov" }
    disclose: [visit, vaccinated, distinct, unique, "reached means", "counted as reached", "definition"]

  - id: T9.7
    tier: T9
    prompt: Which LGA is doing best?
    expect: answer
    tags: [ambiguous, definitions]
    note: "definitions.yaml: best. Kalgo on coverage (94.0%) and zero-dose share (10.9%), Birnin Kebbi on children vaccinated (19,055). Asking which measure is a pass."
    accept: { measures: [children_coverage_pct, children_vaccinated, zero_dose_pct], dimension: [lga] }
    truth:
      shape: set
      unit: count
      sql: "SELECT lga FROM su_ni_cov GROUP BY lga ORDER BY sum(children_vaccinated) / sumIf(target_children, is_last_day = 1) DESC LIMIT 1"
      alternatives:
        - { label: "most children vaccinated", sql: "SELECT lga FROM su_ni_cov GROUP BY lga ORDER BY sum(children_vaccinated) DESC LIMIT 1" }
    disclose: [coverage, "most children", "children vaccinated", "zero-dose", "depends", "measured by", "in terms of"]

  - id: T9.8
    tier: T9
    prompt: How many child visits were in hard-to-reach settlements?
    expect: answer
    tags: [ambiguous, definitions]
    note: "definitions.yaml: hard to reach. Settlement type HARD_TO_REACH 3,333; access class 'Harder to reach' 9,656; access class not Accessible 12,564."
    accept: { measures: [visits], dimension: [settlement_type, access_class], filters: {} }
    truth:
      shape: scalar
      unit: count
      sql: "SELECT countIf(settlement_type = 'HARD_TO_REACH') FROM su_ni_task"
      alternatives:
        - { label: "access class Harder to reach", sql: "SELECT countIf(access_class = 'Harder to reach') FROM su_ni_task" }
        - { label: "access class not Accessible", sql: "SELECT countIf(access_class != 'Accessible') FROM su_ni_task" }
    disclose: ["settlement type", "access class", "access", "accessibility", "classified"]

  - id: T9.9
    tier: T9
    prompt: What is the average coverage across settlements?
    expect: answer
    tags: [ambiguous, definitions]
    note: "definitions.yaml: average coverage. Overall (sum over sum) 93.77% or the plain mean of settlement percentages 94.20%."
    accept: { measures: [children_coverage_pct] }
    truth:
      shape: scalar
      unit: ratio
      sql: "SELECT sum(children_vaccinated) / sumIf(target_children, is_last_day = 1) FROM su_ni_cov"
      alternatives:
        - { label: "mean of settlement percentages", sql: "SELECT avg(r) FROM (SELECT community, sum(children_vaccinated) / nullIf(sumIf(target_children, is_last_day = 1), 0) r FROM su_ni_cov GROUP BY community)" }
    disclose: [overall, pooled, "sum", "total", "weighted", "mean of", "average of", "simple average", "not an average", "rather than averag"]

