<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>lenspack demo</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #fafaf9; color: #1c1917; }
      @media (prefers-color-scheme: dark) { body { background: #09090b; color: #f4f4f5; } }
      .wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
      header h1 { font-size: 18px; margin: 0; }
      .ops { display: flex; gap: 8px; margin-bottom: 16px; }
      .ops input { flex: 1; padding: 6px 10px; border: 1px solid #d6d3d1; border-radius: 6px; font: inherit; }
      .ops button, header select { padding: 6px 10px; border: 1px solid #d6d3d1; border-radius: 6px; background: transparent; color: inherit; font: inherit; }
      .err { color: #b45309; font-size: 13px; }
      .split { display: grid; grid-template-columns: 1fr; gap: 24px; } @media (min-width: 1000px) { .split { grid-template-columns: 1fr 3fr; } }
      .main { min-width: 0; }
      .chat { position: sticky; top: 16px; display: flex; flex-direction: column; max-height: calc(100vh - 8rem); border: 1px solid #d6d3d1; border-radius: 8px; background: #fff; }
      @media (prefers-color-scheme: dark) { .chat { background: #18181b; border-color: #3f3f46; } .ops input, .chat-form input { background: #18181b; color: inherit; } }
      .chat-head { padding: 8px 12px; border-bottom: 1px solid #e7e5e4; font-size: 14px; font-weight: 500; }
      .chat-log { flex: 1; min-height: 120px; overflow-y: auto; padding: 12px; }
      .chat-suggest { display: block; width: 100%; margin: 6px 0; padding: 6px 8px; text-align: left; font: inherit; font-size: 12px; border: 1px solid #d6d3d1; border-radius: 6px; background: transparent; color: inherit; cursor: pointer; }
      .chat-msg { margin-bottom: 14px; } .chat-role { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: #78716c; margin-bottom: 2px; }
      .chat-text { margin: 4px 0; font-size: 14px; line-height: 1.5; }
      .chat-step { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; color: #78716c; margin-top: 2px; } .chat-step-failed { color: #b45309; } .mono { font-family: ui-monospace, monospace; }
      .chat-form { display: flex; gap: 8px; padding: 8px; border-top: 1px solid #e7e5e4; }
      .chat-form input { flex: 1; padding: 6px 10px; border: 1px solid #d6d3d1; border-radius: 6px; font: inherit; }
      .chat-form button { padding: 6px 10px; border: 1px solid #d6d3d1; border-radius: 6px; background: transparent; color: inherit; font: inherit; }
      .desc { margin: 4px 0 0; font-size: 13px; color: #78716c; }
      footer { margin-top: 24px; font-size: 12px; color: #78716c; } footer a { color: inherit; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
