<!doctype html>
<html lang="en" data-name="__NAME__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>__TITLE__ · __NAME__ admin</title>
<link rel="stylesheet" href="panel.css">
<link rel="stylesheet" href="telemetry.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="mark" aria-hidden="true"></span>
    <div>
      <h1 data-t="title">__NAME__ admin</h1>
      <p class="sub" id="sub"></p>
    </div>
  </div>
  <div class="tools">
    <label class="sel" id="packPick" hidden><span class="vh" data-t="pack">Pack</span><select id="pack"></select></label>
    <div class="seg" role="group" aria-label="Language" id="langs">
      <button type="button" data-lang="en">EN</button><button type="button" data-lang="fr">FR</button>
    </div>
    <button type="button" class="icon" id="theme" aria-label="Theme" title="Theme"></button>
  </div>
</header>
<nav class="tabs" role="tablist" id="tabs">
  <button role="tab" data-tab="overview" data-t="tabOverview">Overview</button>
  <button role="tab" data-tab="review" data-t="tabReview">Review</button>
  <button role="tab" data-tab="questions" data-t="tabQuestions">Open questions</button>
  <button role="tab" data-tab="proposals" data-t="tabProposals">Proposals</button>
  <button role="tab" data-tab="definitions" data-t="tabDefinitions">Definitions</button>
  <button role="tab" data-tab="telemetry" data-t="tabTelemetry">Telemetry</button>
  <button role="tab" data-tab="cache" data-t="tabCache">Cache</button>
  <button role="tab" data-tab="access" data-t="tabAccess">Access</button>
  <button role="tab" data-tab="settings" data-t="tabSettings">Settings</button>
</nav>
<main id="main" tabindex="-1"><p class="mute pad" data-t="loading">Loading…</p></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>/*__ADMIN__*/</script>
<script src="checklist.js"></script>
<script src="telemetry.js"></script>
<script src="panel.js"></script>
</body>
</html>
