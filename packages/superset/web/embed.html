<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lenspack + Superset</title>
<script>/*__VARS__*/</script>
<style>
  :root{--fg:#1f2328;--mute:#667085;--line:#e4e7ec;--bg:#f5f7fa;--acc:#1a85a0}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
  .app{display:grid;grid-template-columns:400px 1fr;height:100vh}
  .side{border-right:1px solid var(--line);background:#fff;min-height:0;display:flex;flex-direction:column}
  .main{display:flex;flex-direction:column;min-width:0;min-height:0}
  .bar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:#fff}
  .bar h1{font-size:15px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .tag{font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:2px 9px}
  .bar a{color:var(--acc);font-size:13px;text-decoration:none;white-space:nowrap}
  .bar a:hover{text-decoration:underline}
  iframe{flex:1;border:0;width:100%;background:#fff}
  .kept{font-size:12px;color:var(--mute);padding:6px 16px;background:#fffbea;border-bottom:1px solid #f5e6a8;display:none}
  @media (max-width:820px){.app{grid-template-columns:1fr;grid-template-rows:55vh 45vh}.side{border-right:0;border-bottom:1px solid var(--line);order:2}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="chat"></aside>
  <main class="main">
    <div class="bar"><h1 id="title">Superset dashboard</h1><span class="tag">Superset, in an iframe</span><a id="all" href="__BASE__/">All dashboards</a><a id="open" target="_blank" rel="noopener">Open in Superset ↗</a></div>
    <div class="kept" id="kept"></div>
    <iframe id="frame" title="Superset dashboard"></iframe>
  </main>
</div>
<script src="__BASE__/chat.js"></script>
<script>
  const v = window.__lp;
  // Superset's address: publicUrl, else this host (Lenspack mounted under Superset's own host), else this host on Superset's port.
  const superset = v.supersetUrl || (v.base ? location.origin : `${location.protocol}//${location.hostname}:${v.supersetPort}`);
  const frame = document.getElementById("frame");
  const url = `${superset}/superset/dashboard/${v.dashboard}/`;
  document.getElementById("open").href = url;
  frame.src = `${url}?standalone=1`;
  fetch(`${v.base}/_superset/bind?dashboard=${v.dashboard}`).then((r) => r.json()).then((b) => {
    if (b.error) throw new Error(b.error);
    document.getElementById("title").textContent = b.title;
    document.title = `${b.title} · Lenspack`;
    if (b.notes && b.notes.length) {
      const k = document.getElementById("kept");
      k.textContent = `Kept as Superset has them (Lenspack can move or remove these, not edit them): ${b.notes.join("; ")}`;
      k.style.display = "block";
    }
    LenspackChat.mount(document.getElementById("chat"), { api: v.base, pack: v.pack, board: b.board, title: b.title, examples: v.examples, onChanged: () => { frame.src = `${url}?standalone=1&t=${Date.now()}`; } });
  }).catch((e) => { document.getElementById("chat").textContent = `Could not open this dashboard: ${e.message}`; });
</script>
</body>
</html>
